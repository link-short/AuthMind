<html>
  <head>

      <title>OTP Login</title>
    
  </head>
  
  <body>

    <form action="../verifyLoginCredetinals.php" method="get">
        <fieldset style="background: #f6f8ff; border: 2px solid #4238ca;">
            <legend>Your Information</legend>
            <input type="text" name="phone" placeholder="Your phone"><br /><br />
            <input type="text" name="username" placeholder="User Name"><br /><br />

            <button type="submit">Next</button>
        </fieldset>

    </form>

        
    
    <form action="../verifyLoginCredetinals.php" method="get">
      
        <label for="otp-input">Enter your verification code:</label>
      
        <input
            type="text"
            id="otp-input"
            name="otp"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="\d{6}"
            required
        >
      
        <button type="submit">Verify</button>
      
    </form>
    
  </body>
  
</html>
