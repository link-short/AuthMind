<html>
  <head>

      <title>OTP Login</title>
    
  </head>
  
  <body>
    
    <form action="./otp/" method="post">
      
        <label for="otp-input">Enter your verification code:</label>
      
        <input
            type="text"
            id="otp-input"
            name="otp"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="\d{6}"
            required
        >
      
        <button type="submit">Verify</button>
      
    </form>
    
  </body>
  
</html>
